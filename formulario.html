<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container py-5">
        <div class="form-card">
            <div class="form-header mb-4">
                <h2>Registro de Usuario</h2>
                <p class="text-muted">Completa los campos para crear tu cuenta</p>
            </div>
            <hr class="divider">

            <form action="backend" method="post" onsubmit="return validar()">

                <!-- Sección: Credenciales -->
                <h5 class="section-title">Credenciales</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="username" class="form-label">Nombre de usuario <span class="required-star">*</span></label>
                        <input type="text" class="form-control" id="username" autocomplete="off">
                        <div id="username-msg" class="form-text error-msg"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="password" class="form-label">Contraseña <span class="required-star">*</span></label>
                        <input type="password" class="form-control" id="password" autocomplete="off">
                        <div id="password-msg" class="form-text error-msg"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="re-password" class="form-label">Confirmar contraseña <span class="required-star">*</span></label>
                        <input type="password" class="form-control" id="re-password" autocomplete="off">
                        <div id="re-password-msg" class="form-text error-msg"></div>
                    </div>
                </div>

                <!-- Sección: Datos personales -->
                <h5 class="section-title mt-3">Datos personales</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="direccion" class="form-label">Dirección <span class="required-star">*</span></label>
                        <input type="text" class="form-control" id="direccion">
                        <div id="direccion-msg" class="form-text error-msg"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="comuna" class="form-label">Comuna <span class="required-star">*</span></label>
                        <select class="form-select" id="comuna">
                            <option value="">-- Selecciona una comuna --</option>
                            <option value="santiago">Santiago</option>
                            <option value="providencia">Providencia</option>
                            <option value="nunoa">Ñuñoa</option>
                            <option value="las_condes">Las Condes</option>
                            <option value="maipu">Maipú</option>
                            <option value="pudahuel">Pudahuel</option>
                            <option value="la_florida">La Florida</option>
                            <option value="penaflor">Peñaflor</option>
                            <option value="quilicura">Quilicura</option>
                            <option value="recoleta">Recoleta</option>
                        </select>
                        <div id="comuna-msg" class="form-text error-msg"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Número de teléfono <span class="required-star">*</span></label>
                        <input type="text" class="form-control" id="telefono" placeholder="+56912345678">
                        <div id="telefono-msg" class="form-text error-msg"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="url" class="form-label">Página web personal</label>
                        <input type="text" class="form-control" id="url" placeholder="https://mipagina.com">
                        <div id="url-msg" class="form-text error-msg"></div>
                    </div>
                </div>

                <!-- Sección: Aficiones -->
                <h5 class="section-title mt-3">Aficiones</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="hobby" class="form-label">Agregar afición <span class="required-star">*</span></label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="hobby" placeholder="Escribe una afición">
                            <button class="btn btn-add" type="button" onclick="agregarAficion()">Agregar</button>
                        </div>
                        <div id="hobby-msg" class="form-text error-msg"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Aficiones agregadas</label>
                        <ul id="hobby-list" class="list-group hobby-list"></ul>
                        <div id="hobby-count-msg" class="form-text error-msg mt-1"></div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary-custom">Enviar</button>
                    <button type="button" class="btn btn-secondary-custom" onclick="limpiarFormulario()">Limpiar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
